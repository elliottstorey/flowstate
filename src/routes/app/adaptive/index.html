<link rel="stylesheet" href="adaptive/styles.css">
<script src="adaptive/script.js" type="module" defer></script>

<main>
	<nav>
		<h2 onclick="$.url = '/app'">flowstate</h2>
	</nav>
	<div id="tabs" hidden>
		<button data-tab="reference" hidden>Passage</button>
		<button data-tab="problem" class="active">Question</button>
		<button data-tab="chat" id="tab-chat" hidden>Tutor</button>
	</div>
	<div id="question">
		<div id="reference" hidden>
			<p id="passage-heading">Passage</p>
			<p id="passage"></p>
		</div>
		<div id="problem">
			<p id="problem-heading"></p>
			<p id="stimulus"></p>
			<p id="stem"></p>
			<div id="choices">
				<button id="A" class="choice">
					<p><span class="letter">A</span><span class="content"></span></p>
					<p class="rationale" hidden>
						<span class="rationale-toggle">Show rationale</span>
						<span class="rationale-text" hidden></span>
					</p>
				</button>
				<button id="B" class="choice">
					<p><span class="letter">B</span><span class="content"></span></p>
					<p class="rationale" hidden>
						<span class="rationale-toggle">Show rationale</span>
						<span class="rationale-text" hidden></span>
					</p>
				</button>
				<button id="C" class="choice">
					<p><span class="letter">C</span><span class="content"></span></p>
					<p class="rationale" hidden>
						<span class="rationale-toggle">Show rationale</span>
						<span class="rationale-text" hidden></span>
					</p>
				</button>
				<button id="D" class="choice">
					<p><span class="letter">D</span><span class="content"></span></p>
					<p class="rationale" hidden>
						<span class="rationale-toggle">Show rationale</span>
						<span class="rationale-text" hidden></span>
					</p>
				</button>
				<button id="E" class="choice">
					<p><span class="letter">E</span><span class="content"></span></p>
					<p class="rationale" hidden>
						<span class="rationale-toggle">Show rationale</span>
						<span class="rationale-text" hidden></span>
					</p>
				</button>
			</div>
			<button id="show-answer" hidden>Show answer</button>
			<button id="next" hidden>Next question --></button>
		</div>
	</div>
</main>

<!-- Update your aside inside the HTML -->
<aside id="chat" hidden>
	<div id="chat-heading">
		<div class="tutor-title">
			<tutor-orb></tutor-orb><span>Tutor</span>
		</div>
		<span id="message-counter"><span id="messages-left"></span> of 25 free messages remaining</span>
	</div>
	<div id="messages">
		<tutor-orb id="loading"></tutor-orb>
	</div>
	<input id="chat-input" placeholder="Ask a question about the problem..." />
</aside>
