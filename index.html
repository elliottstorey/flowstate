<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siri Orb Vanilla Renderer</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #111; /* Dark background to see the glow */
      margin: 0;
      font-family: system-ui, sans-serif;
      color: white;
    }

    @property --angle {
      syntax: "<angle>";
      inherits: true;
      initial-value: 0deg;
    }

    .siri-orb {
      /* Default Colors */
      --bg: oklch(95% 0.02 264.695);
      --c1: oklch(75% 0.15 350);
      --c2: oklch(80% 0.12 200);
      --c3: oklch(78% 0.14 280);
      --angle: 0deg;

      display: grid;
      grid-template-areas: "stack";
      overflow: hidden;
      border-radius: 50%;
      position: relative;
    }

    /* CSS Animation class toggled by JS */
    .siri-orb.animate {
      animation: rotate 20s linear infinite;
    }

    .siri-orb::before,
    .siri-orb::after {
      content: "";
      display: block;
      grid-area: stack;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .siri-orb::before {
      background:
        conic-gradient(from calc(var(--angle) * 2) at 25% 70%, var(--c3), transparent 20% 80%, var(--c3)),
        conic-gradient(from calc(var(--angle) * 2) at 45% 75%, var(--c2), transparent 30% 60%, var(--c2)),
        conic-gradient(from calc(var(--angle) * -3) at 80% 20%, var(--c1), transparent 40% 60%, var(--c1)),
        conic-gradient(from calc(var(--angle) * 2) at 15% 5%, var(--c2), transparent 10% 90%, var(--c2)),
        conic-gradient(from calc(var(--angle) * 1) at 20% 80%, var(--c1), transparent 10% 90%, var(--c1)),
        conic-gradient(from calc(var(--angle) * -2) at 85% 10%, var(--c3), transparent 20% 80%, var(--c3));
      box-shadow: inset var(--bg) 0 0 var(--shadow-spread) calc(var(--shadow-spread) * 0.2);
      filter: blur(var(--blur-amount)) contrast(var(--contrast-amount));
    }

    .siri-orb::after {
      background-image: radial-gradient(circle at center, var(--bg) var(--dot-size), transparent var(--dot-size));
      background-size: calc(var(--dot-size) * 2) calc(var(--dot-size) * 2);
      backdrop-filter: blur(calc(var(--blur-amount) * 2)) contrast(calc(var(--contrast-amount) * 2));
      -webkit-backdrop-filter: blur(calc(var(--blur-amount) * 2)) contrast(calc(var(--contrast-amount) * 2));
      mix-blend-mode: overlay;
      mask-image: radial-gradient(black var(--mask-radius), transparent 75%);
      -webkit-mask-image: radial-gradient(black var(--mask-radius), transparent 75%);
    }

    /* Remove mask if radius is 0% */
    .siri-orb[style*="--mask-radius: 0%"]::after {
      mask-image: none;
      -webkit-mask-image: none;
    }

    @keyframes rotate {
      to { --angle: 360deg; }
    }

    /* UI Controls for preview */
    .controls {
      margin-top: 40px;
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 300px;
    }
    .control-group { display: flex; flex-direction: column; gap: 8px; }
    input[type=range] { width: 100%; cursor: pointer; }
    button {
      padding: 10px;
      background: white;
      color: black;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #ddd; }
  </style>
</head>
<body>

  <div class="siri-orb" id="orb"></div>

  <div class="controls" id="controls">
    <div class="control-group">
      <label>Orb Size: <span id="sizeValue">192</span>px</label>
      <input type="range" id="sizeSlider" min="16" max="512" value="192">
    </div>
    <div class="control-group">
      <label>Animation Frame (Angle): <span id="angleValue">0</span>&deg;</label>
      <input type="range" id="angleSlider" min="0" max="360" value="0">
    </div>
    <button id="toggleAnim">Play / Pause CSS Animation</button>
  </div>

  <script>
    const orb = document.getElementById('orb');
    
    // JS Recreation of your React layout logic
    function updateOrbStyles(sizeValue) {
      orb.style.width = `${sizeValue}px`;
      orb.style.height = `${sizeValue}px`;

      const blurAmount = sizeValue < 50 
        ? Math.max(sizeValue * 0.008, 1) 
        : Math.max(sizeValue * 0.015, 4);

      const contrastAmount = sizeValue < 50 
        ? Math.max(sizeValue * 0.004, 1.2) 
        : Math.max(sizeValue * 0.008, 1.5);

      const dotSize = sizeValue < 50 
        ? Math.max(sizeValue * 0.004, 0.05) 
        : Math.max(sizeValue * 0.008, 0.1);

      const shadowSpread = sizeValue < 50 
        ? Math.max(sizeValue * 0.004, 0.5) 
        : Math.max(sizeValue * 0.008, 2);

      let maskRadius = "25%";
      if (sizeValue < 30) maskRadius = "0%";
      else if (sizeValue < 50) maskRadius = "5%";
      else if (sizeValue < 100) maskRadius = "15%";

      let finalContrast = contrastAmount;
      if (sizeValue < 30) finalContrast = 1.1;
      else if (sizeValue < 50) finalContrast = Math.max(contrastAmount * 1.2, 1.3);

      orb.style.setProperty('--blur-amount', `${blurAmount}px`);
      orb.style.setProperty('--contrast-amount', finalContrast);
      orb.style.setProperty('--dot-size', `${dotSize}px`);
      orb.style.setProperty('--shadow-spread', `${shadowSpread}px`);
      orb.style.setProperty('--mask-radius', maskRadius);
    }

    // Initialize defaults
    updateOrbStyles(192);

    // Event Listeners for UI
    document.getElementById('sizeSlider').addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      document.getElementById('sizeValue').textContent = val;
      updateOrbStyles(val);
    });

    document.getElementById('angleSlider').addEventListener('input', (e) => {
      orb.classList.remove('animate'); // Pause CSS animation to take over manually
      const val = e.target.value;
      orb.style.setProperty('--angle', `${val}deg`);
      document.getElementById('angleValue').textContent = val;
    });

    document.getElementById('toggleAnim').addEventListener('click', () => {
      if (orb.classList.contains('animate')) {
        orb.classList.remove('animate');
      } else {
        orb.style.removeProperty('--angle'); // Let CSS take over
        orb.classList.add('animate');
      }
    });
  </script>
</body>
</html>
